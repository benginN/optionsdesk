services:
  optionsdesk:
    image: ghcr.io/benginn/optionsdesk:latest
    # To build from source, comment out the line above and uncomment this one:
    # build: .
    container_name: optionsdesk
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Istanbul   # log timestamps only; the scheduler always uses US Eastern Time
      - PUID=1000            # user that runs the server and owns ./data
      - PGID=1000
      # - INTRADAY_REFRESH=1     # re-price stocks during market hours (15-min delayed); see README
      # - INTRADAY_PACE_SEC=6    # seconds between intraday requests (~200 stocks every ~20 min)
    volumes:
      - ./data:/app/data
    # Read by Glance's docker-containers widget (optional)
    labels:
      glance.name: Options Desk
      glance.icon: mdi:chart-bell-curve
      glance.url: http://localhost:8000   # replace with your server address, e.g. http://192.168.1.10:8000
      glance.description: US options analytics
